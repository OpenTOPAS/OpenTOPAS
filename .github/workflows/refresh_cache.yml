name: Refresh Cache
on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight UTC

jobs:
  refresh-cache:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Refresh Geant4 data cache
        uses: actions/cache@v4
        with:
          path: ~/geant4-data
          key: ${{ runner.os }}-geant4-data-v11.3.2-${{ hashFiles('.github/workflows/g4data_urls.txt') }}

      - name: Refresh Geant4 install cache
        uses: actions/cache@v4
        with:
          path: ~/geant4-install
          key: ${{ runner.os }}-geant4-v11.3.2-install
