name: Build and Push Multi-Arch TOPAS Image

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing OpenTOPAS release tag to build (e.g. v4.3.0)'
        required: true

jobs:
  resolve-tags:
    name: Resolve Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Validate release tag
        id: vars
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG:-${GITHUB_REF#refs/tags/}}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected an existing release tag such as v4.3.0; received: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Geant4 ${{ matrix.geant4 }} / ${{ matrix.platform }}
    needs: resolve-tags
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - geant4: '11.3.2'
            platform: linux/amd64
            suffix: amd64
            runner: ubuntu-latest
          - geant4: '11.3.2'
            platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
          - geant4: '11.4.2'
            platform: linux/amd64
            suffix: amd64
            runner: ubuntu-latest
          - geant4: '11.4.2'
            platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tags.outputs.tag }}

      - name: Check release version references
        run: bash scripts/check-topas-version.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.github/workflows/Dockerfile.topas.workflow
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/opentopas:${{ needs.resolve-tags.outputs.tag }}-geant4-${{ matrix.geant4 }}-${{ matrix.suffix }}
          build-args: |
            TOPAS_VERSION=${{ needs.resolve-tags.outputs.tag }}
            G4_VERSION=${{ matrix.geant4 }}
          cache-from: type=gha,scope=g4-${{ matrix.geant4 }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=g4-${{ matrix.geant4 }}-${{ matrix.suffix }}

  manifest:
    name: Publish Geant4 ${{ matrix.geant4 }} Multi-Arch Manifest
    needs: [resolve-tags, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        geant4: ['11.3.2', '11.4.2']
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish versioned manifest
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/opentopas
          TAG: ${{ needs.resolve-tags.outputs.tag }}-geant4-${{ matrix.geant4 }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
